<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GameStore</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <!-- Menú: cada enlace abre un formulario -->
    <nav class="navbar navbar-expand bg-dark" data-bs-theme="dark">
        <div class="container">
            <span class="navbar-brand">GameStore</span>
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="#" id="mnuCrearVideojuego">Crear videojuego</a></li>
                <li class="nav-item"><a class="nav-link" href="#" id="mnuListado">Listado</a></li>
            </ul>
        </div>
    </nav>

    <main class="container my-4">

        <!-- Formulario de creación de videojuegos -->
        <form id="frmCrearVideojuego" class="p-3 rounded bg-info-subtle">
            <h4 class="mb-3">Crear videojuego</h4>

            <div class="row mb-3">
                <label class="col-sm-4 col-form-label">Plataforma</label>
                <div class="col-sm-8">
                    <select id="lstPlataformaCrear" name="lstPlataforma" class="form-select"></select>
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-sm-4 col-form-label" for="txtTitulo">Título</label>
                <div class="col-sm-8">
                    <input type="text" id="txtTitulo" name="txtTitulo" class="form-control" maxlength="100" placeholder="Título">
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-sm-4 col-form-label" for="txtDesarrolladora">Desarrolladora</label>
                <div class="col-sm-8">
                    <input type="text" id="txtDesarrolladora" name="txtDesarrolladora" class="form-control" maxlength="100" placeholder="Desarrolladora">
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-sm-4 col-form-label" for="txtPrecio">Precio (€)</label>
                <div class="col-sm-8">
                    <input type="number" id="txtPrecio" name="txtPrecio" class="form-control" min="0" step="0.01" placeholder="0,00">
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-sm-4 col-form-label" for="dtFecha">Fecha de lanzamiento</label>
                <div class="col-sm-8">
                    <input type="date" id="dtFecha" name="dtFecha" class="form-control">
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-sm-4 col-form-label" for="txtPortada">Url de la portada</label>
                <div class="col-sm-8">
                    <input type="text" id="txtPortada" name="txtPortada" class="form-control" maxlength="150" placeholder="Url de la portada">
                </div>
            </div>


            <div class="row">
                <div class="col-sm-8 offset-sm-4">
                    <button type="button" id="btnCrear" class="btn btn-primary">Crear videojuego</button>
                </div>
            </div>
        </form>

        <!-- Formulario del listado -->
        <form id="frmListado" class="p-3 rounded bg-info-subtle">
            <h4 class="mb-3">Listado de videojuegos</h4>

            <div class="row mb-3">
                <label class="col-sm-4 col-form-label">Plataforma</label>
                <div class="col-sm-8">
                    <select id="lstPlataformaListado" name="lstPlataforma" class="form-select"></select>
                </div>
            </div>

            <div class="row mb-3">
                <label class="col-sm-4 col-form-label">Ordenar por</label>
                <div class="col-sm-8 pt-2">
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="rdoOrden" id="rdoTitulo" value="titulo" checked>
                        <label class="form-check-label" for="rdoTitulo">Título</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="rdoOrden" id="rdoPrecio" value="precio">
                        <label class="form-check-label" for="rdoPrecio">Precio</label>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-sm-8 offset-sm-4">
                    <button type="button" id="btnListar" class="btn btn-primary">Mostrar listado</button>
                </div>
            </div>
        </form>

    </main>

    <script src="bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="js/ajax.js"></script>
    <script src="js/objetos.js"></script>
    <script src="js/codigo.js"></script>
</body>

</html>
